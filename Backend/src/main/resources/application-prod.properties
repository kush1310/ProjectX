# ===================================================================
# Charusat Needs — Production Configuration Profile (prod)
# Activated via: -Dspring.profiles.active=prod or SPRING_PROFILES_ACTIVE=prod
# All credentials MUST be injected via container environment variables.
# ===================================================================

# Database Connectivity (Neon PostgreSQL Instance with SSL)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pooling (HikariCP Sizing for Cloud & Free Tier Limits)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=20000

# Disable automatic DDL in production (schema managed via verified migrations)
spring.sql.init.mode=never

# Server Configuration (Render dynamically injects PORT)
server.port=${PORT:8000}
server.forward-headers-strategy=native

# JWT Secrets (Must be 256-bit Base64 string from environment)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:900000}

# CORS Configuration (Production Vercel Domain Only - Injected by Cloud Environment)
spring.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Session & Cookie Security (Strict HTTPS)
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# Field Encryption Key (AES-256-GCM)
security.encryption.key=${FIELD_ENCRYPTION_KEY}

# Application Payload Encryption Key
security.payload.encryption.key=${PAYLOAD_ENCRYPTION_KEY}

# Razorpay Production Merchant Credentials
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET}

# Brevo HTTPS API Configuration (Bypasses Render outbound SMTP port block)
spring.mail.username=${BREVO_SENDER_EMAIL}
spring.mail.password=${BREVO_API_KEY}
spring.mail.from=${BREVO_SENDER_EMAIL}
spring.mail.from-name=${BREVO_SENDER_NAME:Charusat Needs}
app.frontend.url=${FRONTEND_URL}

# Google OAuth2 Credentials
google.client.id=${GOOGLE_CLIENT_ID}
google.client.secret=${GOOGLE_CLIENT_SECRET}
google.redirect.uri=${GOOGLE_REDIRECT_URI}

# Redis / Upstash Cache Configuration (Serverless TLS Connection)
spring.data.redis.url=${REDIS_URL:}
spring.data.redis.host=${REDIS_HOST:}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:true}
redis.enabled=${REDIS_ENABLED:true}
redis.default-ttl-seconds=${REDIS_TTL_SECONDS:300}

# Media Storage (ImageKit CDN + Backblaze B2 Object Storage)
media.storage.provider=${MEDIA_STORAGE_PROVIDER:imagekit}
imagekit.public-key=${IMAGEKIT_PUBLIC_KEY:}
imagekit.private-key=${IMAGEKIT_PRIVATE_KEY:}
imagekit.url-endpoint=${IMAGEKIT_URL_ENDPOINT:}

b2.endpoint=${B2_ENDPOINT:}
b2.bucket=${B2_BUCKET:}
b2.key-id=${B2_KEY_ID:}
b2.application-key=${B2_APPLICATION_KEY:}

# Production Logging: Minimal Verbosity, Strict Format
logging.level.root=WARN
logging.level.com.charusat.canteen=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
