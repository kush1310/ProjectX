# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/charusatneeds
spring.datasource.username=postgres
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JDBC Schema Initialization (replaces Hibernate DDL)
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate=DEBUG

# Server Port
server.port=8000

# File Upload Configuration (Profile images up to 4MB)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=4MB
spring.servlet.multipart.max-request-size=10MB

# JWT Configuration
# CRITICAL: This must be a valid Base64-encoded 256-bit key (32 raw bytes).
# Generated with: python -c "import base64,os; print(base64.b64encode(os.urandom(32)).decode())"
# In production, store this in an environment variable: JWT_SECRET
jwt.secret=${JWT_SECRET:charusatneedsdevsecretkeyminimum256bitsneededforsecurity}
# Access token lifetime: 15 minutes (900000 ms) — short-lived, refresh token handles session
jwt.expiration=900000

# CORS
spring.web.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://localhost:5174

# Mail Configuration (Brevo HTTP API)
# spring.mail.host=smtp-relay.brevo.com
# spring.mail.port=587
spring.mail.username=${BREVO_SENDER_EMAIL:canteen-alerts@charusat.edu.in}
# Used as Brevo API Key
spring.mail.password=${BREVO_API_KEY:}
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.from=${BREVO_SENDER_EMAIL:canteen-alerts@charusat.edu.in}
spring.mail.from-name=${BREVO_SENDER_NAME:Charusat Needs}

# Google OAuth2 Configuration
google.client.id=${GOOGLE_CLIENT_ID:412237294748-rtk111689l4fkskieu9icvhkmampdvv5.apps.googleusercontent.com}
google.client.secret=${GOOGLE_CLIENT_SECRET:}
google.redirect.uri=${GOOGLE_REDIRECT_URI:http://localhost:5173/auth/callback}

# ============================
# SECURITY CONFIGURATION
# ============================

# Frontend URL (for email links)
app.frontend.url=http://localhost:5173

# Password Policy (NIST 800-63B)
security.password.min-length=8
security.password.max-length=128
security.password.require-uppercase=true
security.password.require-lowercase=true
security.password.require-digit=true
security.password.require-special=false
security.password.history-count=5

# Account Lockout Settings (5 failures in 15 min = 5 min base lockout, progressive)
security.lockout.max-attempts=5
security.lockout.window-minutes=15
security.lockout.duration-minutes=5

# IP Rate Limiting
security.rate-limit.ip-max-attempts=10

# Refresh Token Configuration
security.refresh-token.expiry-days=30
security.refresh-token.max-per-user=5

# Session Configuration
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
# Set to true in production (requires HTTPS)
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=strict

# ============================
# FIELD ENCRYPTION (AES-256-GCM)
# ============================
# IMPORTANT: In production, inject via environment variable: FIELD_ENCRYPTION_KEY
# This key encrypts sensitive DB columns: mobile, mfa_secret, account_number
security.encryption.key=${FIELD_ENCRYPTION_KEY:CharusatNeeds2026!AES256FieldKey}

# ============================
# MFA (TOTP) CONFIGURATION
# ============================
security.mfa.issuer=CharusatNeeds
security.mfa.code-length=6
security.mfa.time-period=30
security.mfa.allowed-time-drift=1

# ============================
# PAYLOAD ENCRYPTION (AES-256-GCM — Application Layer)
# ============================
# IMPORTANT: In production, inject via environment variable: PAYLOAD_ENCRYPTION_KEY
# Both frontend (payloadCrypto.ts) and backend (PayloadCryptoService) derive the
# AES-256 key from this string using HMAC-SHA256 with a fixed KDF salt.
security.payload.encryption.key=${PAYLOAD_ENCRYPTION_KEY:CharusatNeedsPayloadKey2026!!}

# ============================
# RAZORPAY PAYMENT GATEWAY
# ============================
# IMPORTANT: In production, store these in environment variables or vault
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:}

# ============================
# REDIS CACHE (Upstash / Local)
# ============================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
redis.enabled=${REDIS_ENABLED:false}
redis.default-ttl-seconds=${REDIS_TTL_SECONDS:300}

# ============================
# MEDIA STORAGE (ImageKit CDN + Backblaze B2)
# ============================
media.storage.provider=${MEDIA_STORAGE_PROVIDER:imagekit}
imagekit.public-key=${IMAGEKIT_PUBLIC_KEY:public_+grCFOmI0qDm3NTqiEhsvLFrhgc=}
imagekit.private-key=${IMAGEKIT_PRIVATE_KEY:}
imagekit.url-endpoint=${IMAGEKIT_URL_ENDPOINT:https://ik.imagekit.io/cyseckush/}
