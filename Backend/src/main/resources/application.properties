# ============================
# SECURITY CONFIGURATION
# ============================

# Frontend URL (for email links)
app.frontend.url=http://localhost:5173

# Password Policy (NIST 800-63B)
security.password.min-length=8
security.password.max-length=128
security.password.require-uppercase=true
security.password.require-lowercase=true
security.password.require-digit=true
security.password.require-special=false
security.password.history-count=5

# Account Lockout Settings
security.lockout.max-attempts=5
security.lockout.window-minutes=15
security.lockout.duration-minutes=5

# IP Rate Limiting
security.rate-limit.ip-max-attempts=20

# Refresh Token Configuration
security.refresh-token.expiry-days=30
security.refresh-token.max-per-user=5

# Session Configuration
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax
