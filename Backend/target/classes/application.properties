# =====================================================
# CharusatNeeds - Spring Boot Application Properties
# XAMPP MySQL Configuration
# =====================================================

# Application Info
spring.application.name=CharusatNeeds
server.port=8080

# =====================================================
# MySQL Database Configuration (XAMPP)
# =====================================================
# Make sure XAMPP MySQL is running on port 3306
# Create database 'charusatneeds' using phpMyAdmin or run schema.sql

spring.datasource.url=jdbc:mysql://localhost:3306/charusatneeds?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Settings
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.pool-name=CharusatNeedsPool

# =====================================================
# JPA / Hibernate Configuration
# =====================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# Batch operations
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# =====================================================
# Security Configuration
# =====================================================
# JWT Secret (use environment variable in production)
jwt.secret=CharusatNeeds2026SecretKeyForJWTTokenGenerationMustBe256BitsLong!
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# Password Encoding
security.password-strength.min-length=10
security.password-strength.max-length=16
security.password-strength.min-uppercase=2
security.password-strength.min-lowercase=2
security.password-strength.min-digits=1
security.password-strength.min-special=1

# Rate Limiting
security.rate-limit.max-attempts=3
security.rate-limit.lockout-duration=44

# =====================================================
# Email Configuration (Gmail SMTP)
# =====================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# =====================================================
# CORS Configuration
# =====================================================
cors.allowed-origins=http://localhost:5173,http://localhost:3000
cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true
cors.max-age=3600

# =====================================================
# File Upload Configuration
# =====================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=2KB

# =====================================================
# Logging Configuration
# =====================================================
logging.level.root=INFO
logging.level.com.charusat=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

logging.file.name=logs/charusatneeds.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30

# =====================================================
# Ordering Time Window Configuration
# =====================================================
# System enforced ordering hours
ordering.time.system-wake=09:30
ordering.time.order-start=10:00
ordering.time.order-cutoff=17:45
ordering.time.fulfillment-end=18:30
ordering.time.system-shutdown=18:30

# =====================================================
# Subscription Configuration
# =====================================================
subscription.trial-days=11
subscription.yearly-price=1111.00
subscription.monthly-price=111.00
subscription.quarterly-price=299.00
subscription.half-yearly-price=555.00

# =====================================================
# Cache Configuration
# =====================================================
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=10m

# =====================================================
# Actuator (Health Check)
# =====================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
management.info.env.enabled=true

# =====================================================
# DevTools (Development Only)
# =====================================================
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
