# ==============================================================================
# CHARUSAT NEEDS — HARDENED PRODUCTION NGINX REVERSE PROXY & CACHING CONFIGURATION
# Production Release Candidate Specification
# Target Environment: Linux (Ubuntu 22.04 LTS / Debian 12) + Nginx 1.25+ / 1.26+
# ==============================================================================

# Worker sizing: 1 worker per CPU core
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 8192;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Performance telemetry log format with upstream latency metrics
    log_format perf_combined '$remote_addr - $remote_user [$time_local] '
                            '"$request" $status $body_bytes_sent '
                            '"$http_referer" "$http_user_agent" '
                            'rt=$request_time uct="$upstream_connect_time" '
                            'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log perf_combined buffer=64k flush=5m;
    error_log  /var/log/nginx/error.log warn;

    # High-throughput TCP optimizations
    sendfile                  on;
    tcp_nopush                on;
    tcp_nodelay               on;
    keepalive_timeout         65;
    keepalive_requests        1000;
    reset_timedout_connection on;
    client_body_timeout       15;
    send_timeout              15;

    # ==========================================================================
    # COMPRESSION CONFIGURATION
    # Dynamic Gzip (universal standard across all Nginx installations)
    # Pre-compressed static Brotli/Gzip enabled when compiled with ngx_brotli
    # ==========================================================================
    gzip                      on;
    gzip_vary                 on;
    gzip_proxied              any;
    gzip_comp_level           6;
    gzip_min_length           1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Upstream Spring Boot Backend (Port 8000)
    upstream spring_boot_backend {
        server 127.0.0.1:8000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # HTTP Redirect to HTTPS
    server {
        listen 80;
        listen [::]:80;
        server_name charusatneeds.charusat.edu.in;

        # Institutional deployment: 301 permanent redirect to TLS
        return 301 https://$host$request_uri;
    }

    # HTTPS Production Virtual Host
    server {
        # Modern Nginx syntax (>= 1.25.1): http2 on separate directive
        # For legacy Nginx (<= 1.24), use: listen 443 ssl http2;
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name charusatneeds.charusat.edu.in;

        # TLS Hardening (TLS 1.2 and TLS 1.3 only; no legacy SSLv3/TLS1.0/1.1)
        ssl_certificate           /etc/ssl/certs/charusatneeds.crt;
        ssl_certificate_key       /etc/ssl/private/charusatneeds.key;
        ssl_protocols             TLSv1.2 TLSv1.3;
        ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache         shared:SSL:10m;
        ssl_session_timeout       1d;
        ssl_session_tickets       off;

        # Security Headers (OWASP 2025/2026 Compliant)
        # Note: X-XSS-Protection omitted per modern OWASP guidance (superseded by CSP)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Institutional HSTS: Omit includeSubDomains/preload to prevent breaking other campus subdomains
        add_header Strict-Transport-Security "max-age=31536000" always;

        # Content Security Policy (Verified compatible with React, Razorpay, Google Fonts, and WebSockets)
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://checkout.razorpay.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https://charusatneeds.charusat.edu.in wss://charusatneeds.charusat.edu.in https://api.razorpay.com; frame-src https://api.razorpay.com;" always;

        # Frontend Static Root
        root /var/www/charusatneeds/frontend/dist;
        index index.html;

        # ======================================================================
        # 1. HASHED STATIC ASSETS (Immutable 1-Year Cache)
        # ======================================================================
        location ^~ /assets/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Access-Control-Allow-Origin "*";
            access_log off;
            try_files $uri =404;
        }

        # ======================================================================
        # 2. STATIC BRANDING & MEDIA (30-Day Cache)
        # ======================================================================
        location ~* \.(png|jpg|jpeg|gif|webp|svg|ico|woff2?|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
            access_log off;
            try_files $uri =404;
        }

        # ======================================================================
        # 3. HTML ENTRY POINT & SPA ROUTING (Strict Revalidation)
        # ======================================================================
        location / {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            try_files $uri $uri/ /index.html;
        }

        # ======================================================================
        # 4. REST API PROXY (Spring Boot Backend)
        # ======================================================================
        location /api/ {
            proxy_pass http://spring_boot_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Buffering and timeouts
            proxy_buffering on;
            proxy_buffer_size 8k;
            proxy_buffers 16 16k;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;

            # Strictly disable caching on transactional API endpoints
            add_header Cache-Control "no-store, no-cache, private, must-revalidate" always;
        }

        # ======================================================================
        # 5. WEBSOCKET / STOMP PROXY (Real-Time Order Terminal)
        # ======================================================================
        location /ws/ {
            proxy_pass http://spring_boot_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Long timeout for continuous order streaming
            proxy_connect_timeout 7s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ======================================================================
        # 6. DETERMINISTIC HEALTH CHECK ENDPOINT
        # ======================================================================
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "OK\n";
        }
    }
}
